<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Medições GCT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: lateral fixa com a lista de contratos (como uma placa de saída), área principal rolável; no celular a lista vira um seletor no topo. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e8ecf2;
  --line: #d3d9e2;
  --fg: #1b2230;
  --muted: #5b6576;
  --accent: #1f3a68;        /* azul-marinho */
  --accent-soft: #dfe6f2;
  --on-accent: #ffffff;
  --side: #1f3a68;          /* lateral */
  --on-side: #ffffff;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --crit: #b3261e;
  --crit-soft: #f9dedb;
  --ok: #1f7a46;
  --ok-soft: #dcf1e3;
  --info: #2f5f8f;
  --info-soft: #dde8f4;
  --alt: #6a3fb0;          /* falta lançar no financeiro */
  --alt-soft: #ece4f8;
  --e-medido: #b9c7de; --e-faturado: #5b7bb0; --e-recebido: #1f3a68;   /* etapas do gráfico, claro -> escuro */
  --atencao: #fffaf1;      /* fundo do quadro de alertas */
  --atencao-borda: #ecd9b4;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #19202a; --sunk: #202834; --line: #303a49; --fg: #e3e8f0; --muted: #9aa5b6;
  --accent: #9db8e8; --accent-soft: #1d2a40; --on-accent: #0e1626; --side: #16233d; --on-side: #e8eefa;
  --warn: #f0b45a; --warn-soft: #3a2b12; --crit: #f28b82; --crit-soft: #3d1d1b; --ok: #6fd39a; --ok-soft: #173325;
  --info: #8fb8e3; --info-soft: #1c2b3c; --alt: #c3a6f2; --alt-soft: #2c2240;
  --e-medido: #2c3b57; --e-faturado: #4d6ea6; --e-recebido: #a9c2ee;
  --atencao: #1d2330; --atencao-borda: #4a3a24; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #19202a; --sunk: #202834; --line: #303a49; --fg: #e3e8f0; --muted: #9aa5b6;
  --accent: #9db8e8; --accent-soft: #1d2a40; --on-accent: #0e1626; --side: #16233d; --on-side: #e8eefa;
  --warn: #f0b45a; --warn-soft: #3a2b12; --crit: #f28b82; --crit-soft: #3d1d1b; --ok: #6fd39a; --ok-soft: #173325;
  --info: #8fb8e3; --info-soft: #1c2b3c; --alt: #c3a6f2; --alt-soft: #2c2240;
  --e-medido: #2c3b57; --e-faturado: #4d6ea6; --e-recebido: #a9c2ee;
  --atencao: #1d2330; --atencao-borda: #4a3a24; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-display); font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--on-side); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 12px; border-bottom: 2px solid color-mix(in srgb, var(--on-side) 35%, transparent); }
.brand b { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .02em; }
.brand span { font-size: .8rem; opacity: .85; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-family: var(--font-display); font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .75; padding: 12px 8px 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 4px; color: inherit; text-decoration: none; font-size: .92rem; }
.nav a:hover { background: color-mix(in srgb, var(--on-side) 12%, transparent); }
.nav a[aria-current="page"] { background: var(--on-side); color: var(--side); font-weight: 600; }
.nav .badge { flex: none; }
.side-foot { margin-top: auto; font-size: .78rem; opacity: .85; padding: 0 8px; }

.main { padding-block: 24px 48px; padding-left: max(16px, 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.mobile-nav { display: none; }
#view { display: contents; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
select, input[type="text"], input[type="number"], input[type="month"] { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 7px 12px; cursor: pointer; text-decoration: none; color: var(--fg); font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
.btn[disabled] { opacity: .5; cursor: default; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: .8rem; }

.section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-family: var(--font-display); font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunk); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunk); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-recebido { background: var(--ok-soft); color: var(--ok); }
.s-parcial { background: var(--info-soft); color: var(--info); }
.s-faturado { background: var(--info-soft); color: var(--info); }
.s-medido { background: var(--warn-soft); color: var(--warn); }
.s-sem-medicao { background: var(--sunk); color: var(--muted); }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge.critico, .badge.muito-critico { background: var(--crit); color: var(--surface); }
.badge.atrasado { background: var(--warn); color: var(--surface); }

.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert .stripe { align-self: stretch; border-radius: 0 3px 3px 0; }
.alert.critico .stripe, .alert.muito-critico .stripe { background: var(--crit); }
.alert.muito-critico { background: var(--crit-soft); }
.alert.atrasado .stripe { background: var(--warn); }
.alert-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.alert-text a { font-weight: 600; text-decoration: none; }
.alert-text a:hover { text-decoration: underline; }
.alert .late { font-family: var(--font-display); font-weight: 600; text-align: right; white-space: nowrap; }
.alert.critico .late, .alert.muito-critico .late { color: var(--crit); }
.alert .late b { font-size: 1.15rem; }
.alert details { margin-top: 4px; font-size: .85rem; }
.alert summary { cursor: pointer; color: var(--accent); width: fit-content; }
.alert details ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.alert.atrasado .late { color: var(--warn); }
.conf { display: inline-block; margin-top: 4px; font-size: .74rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.conf-confere { color: var(--ok); padding-left: 0; font-weight: 600; }
.conf-aguardando-protocolo { background: var(--warn-soft); color: var(--warn); }
.conf-falta-financeiro { background: var(--alt-soft); color: var(--alt); }
.tipo-protocolo { color: var(--warn); }
.tipo-financeiro { color: var(--alt); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* Quadro de alertas: um só bloco, logo abaixo dos valores */
.quadro { background: var(--atencao); border: 1px solid var(--atencao-borda); border-radius: 8px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.quadro-topo { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.quadro-topo h2 { font-size: 1.15rem; }
.quadro-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; align-items: start; }
.q-col { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.q-col h3 { font-size: .9rem; display: flex; justify-content: space-between; gap: 8px; }
.q-col h3 span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.q-col.vazio { opacity: .6; }
.q-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.q-col li a { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 4px; color: var(--fg); text-decoration: none; font-size: .88rem; }
.q-col li a:hover { background: var(--sunk); }
.q-col li a > span:nth-child(2) { overflow-wrap: anywhere; }
.q-col li small { display: block; color: var(--muted); font-size: .76rem; }
.q-dot { width: 8px; height: 8px; border-radius: 50%; }
.q-dot.atrasado { background: var(--warn); }
.q-dot.critico, .q-dot.muito-critico { background: var(--crit); }
.q-dot.muito-critico { box-shadow: 0 0 0 2px var(--crit-soft); }
.q-dias { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .85rem; }
.q-dias.critico, .q-dias.muito-critico { color: var(--crit); }
.q-dias.atrasado { color: var(--warn); }
.q-nada { color: var(--muted); font-size: .85rem; }
.q-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); }
.q-leg span { display: inline-flex; align-items: center; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: .82rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.fact { background: var(--surface); box-shadow: 1px 1px 0 var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact b { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.over { background: var(--crit); }

.chart { padding: 12px 8px 4px; }
.etapas { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.etapas-resumo { margin: 0; font-size: .95rem; max-width: 75ch; }
.etapas-legenda { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .86rem; }
.etapas-legenda span { display: inline-block; }
.etapas-legenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 7px; }
.etapas-legenda b { font-variant-numeric: tabular-nums; }
.etapas-linhas { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.etapas-mes { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.etapas-barra { display: flex; gap: 2px; height: 18px; min-width: 0; }
.etapas-barra i { display: block; height: 100%; min-width: 2px; }
.etapas-barra i:first-child { border-radius: 4px 0 0 4px; }
.etapas-barra i:last-child { border-radius: 0 4px 4px 0; }
.etapas-barra i:only-child { border-radius: 4px; }
.etapas-barra i:hover { filter: brightness(1.08); outline: 2px solid var(--fg); outline-offset: 1px; }
.etapas-total { font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
@media (max-width: 480px) { .etapas-total { font-size: .78rem; } }
.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); padding: 0 14px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.note { font-size: .82rem; color: var(--muted); }
.notice { background: var(--warn-soft); color: var(--fg); border-radius: 6px; padding: 10px 14px; font-size: .88rem; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.obs { font-size: .82rem; color: var(--muted); max-width: 28ch; }
.edit-row td { background: var(--sunk); }
.edit-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.edit-grid .field { flex: 1 1 200px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--fg); }
details.panel summary { cursor: pointer; padding: 12px 14px; font-family: var(--font-display); font-weight: 600; }
.aviso-fundo { position: fixed; inset: 0; background: color-mix(in srgb, #0b1220 45%, transparent); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.aviso { background: var(--surface); color: var(--fg); border-radius: 10px; border-top: 5px solid var(--crit); width: min(520px, 100%); max-height: 85vh; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.aviso h2 { font-size: 1.35rem; }
.aviso p { margin: 0; }
.aviso ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.aviso li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; background: var(--sunk); border-radius: 6px; font-size: .92rem; }
.aviso li a { flex: 1 1 55%; }
.aviso li small { color: var(--muted); text-align: right; flex: 0 1 auto; }
.aviso-acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.faixa-mes { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--crit-soft); color: var(--fg); border-left: 5px solid var(--crit); border-radius: 6px; padding: 10px 14px; font-size: .95rem; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 6px; font-size: .9rem; }

@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 16px; }
  .mobile-nav { display: flex; flex-direction: column; gap: 6px; }
  .mobile-nav select { width: 100%; }
}
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr); } .kpi + .kpi { border-left: 0; border-top: 1px solid var(--line); } .kpi b { font-size: 1.35rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.login { position: fixed; inset: 0; z-index: 60; background: var(--side); display: grid; place-items: center; padding: 16px; }
.login-caixa { background: var(--surface); color: var(--fg); border-radius: 10px; padding: 24px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
.login-caixa h1 { font-size: 1.6rem; }
.login-caixa input[type="password"] { font-size: 1rem; padding: 10px 12px; }
.login-caixa .btn { justify-content: center; padding: 10px; font-size: 1rem; }
.login-caixa .note { margin: 0; min-height: 1.2em; color: var(--crit); }
</style>

<div class="app">
  <aside class="side" aria-label="Contratos">
    <div class="brand"><b>Medições GCT</b><span>Contratos rodoviários</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main class="main" id="main">
    <div class="mobile-nav"><label class="eyebrow" for="mobile-select">Medições GCT · contrato</label><select id="mobile-select"></select></div>
    <div id="view"><div class="empty">Carregando contratos…</div></div>
  </main>
</div>
<div class="login" id="login" hidden>
  <form class="login-caixa" id="login-form" autocomplete="off">
    <span class="eyebrow">Contratos rodoviários</span>
    <h1>Medições GCT</h1>
    <label class="field" for="login-senha">Senha de acesso<input type="password" id="login-senha" required></label>
    <label class="check"><input type="checkbox" id="login-lembrar" checked> Lembrar neste aparelho</label>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="note" id="login-msg" role="status"></p>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<div class="aviso-fundo" id="aviso" hidden></div>

<script>
// Regras de meses e alertas do painel. Funções puras: recebem os dados e a data de hoje.
const Regras = (() => {
  const mesNum = m => Number(m.slice(0, 4)) * 12 + Number(m.slice(5, 7)) - 1;
  const numMes = n => `${Math.floor(n / 12)}-${String((n % 12) + 1).padStart(2, "0")}`;
  const somaMes = (m, k) => numMes(mesNum(m) + k);
  const dia = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const fimDoMes = m => dia(somaMes(m, 1) + "-01") - 864e5; // último dia do mês
  const dias = (de, ate) => Math.floor((ate - de) / 864e5);
  const tem = v => v !== null && v !== undefined && v !== 0;

  // Hoje no fuso de Brasília, como "AAAA-MM-DD".
  function hojeBrasilia(agora = new Date()) {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(agora);
    const v = t => p.find(x => x.type === t).value;
    return `${v("year")}-${v("month")}-${v("day")}`;
  }

  // Situação de um mês a partir dos valores.
  function situacao(l) {
    if (!l) return "sem-medicao";
    const faturou = tem(l.faturado) || !!l.nf;
    if (faturou && !l.recebimentoPendente && tem(l.recebido)) return "recebido";
    if (faturou && tem(l.recebido)) return "parcial";
    if (faturou) return "faturado";
    if (tem(l.medido)) return "medido";
    return "sem-medicao";
  }

  // Situação protocolada (planilha "Controle de Medições"): é a situação oficial.
  const PROT = { pendente: "sem-medicao", "-": "sem-medicao", medido: "medido", faturado: "faturado", recebido: "recebido" };
  const ORDEM = { "sem-medicao": 0, medido: 1, faturado: 2, parcial: 2, recebido: 3 };
  function protocolo(contrato, mes) {
    const p = contrato.protocolo && contrato.protocolo[mes];
    if (!p) return null;
    if (p === "sem-contrato" || p === "encerrado") return "fora";
    return PROT[p] || null;
  }
  // Situação oficial do mês: a do protocolo; sem protocolo para o mês, a da planilha financeira.
  function oficial(contrato, l) {
    const p = protocolo(contrato, l.mes);
    return p && p !== "fora" ? p : situacao(l);
  }
  // "confere", "aguardando-protocolo" (financeiro à frente) ou "falta-financeiro" (protocolo à frente).
  function conferencia(contrato, l) {
    const p = protocolo(contrato, l.mes);
    if (!p || p === "fora") return null;
    const f = ORDEM[situacao(l)], o = ORDEM[p];
    return f === o ? "confere" : f > o ? "aguardando-protocolo" : "falta-financeiro";
  }

  // Primeiro mês com medição (no financeiro ou no protocolo); editores podem fixar outro em ajuste.inicio.
  function inicioOperacao(contrato, ajuste) {
    if (ajuste && /^\d{4}-\d{2}$/.test(ajuste.inicio || "")) return ajuste.inicio;
    const l = (contrato.linhas || []).find(x => tem(x.medido));
    const p = Object.keys(contrato.protocolo || {}).sort().find(m => ORDEM[protocolo(contrato, m)] >= 1);
    const ms = [l && l.mes, p].filter(Boolean).sort();
    return ms[0] || null;
  }

  // Último mês em que se espera medição: o mês anterior ao atual, limitado ao
  // vencimento (ou ao fim informado pelo editor).
  function fimOperacao(contrato, ajuste, hoje) {
    let fim = somaMes(hoje.slice(0, 7), -1);
    const venc = ajuste && /^\d{4}-\d{2}$/.test(ajuste.fim || "") ? ajuste.fim : (contrato.info && contrato.info.vencimento || "").slice(0, 7);
    if (venc && venc < fim) fim = venc;
    return fim;
  }

  // Meses do contrato, do início até o mês anterior ao atual (inclui lançados depois disso).
  function meses(contrato, ajuste, hoje) {
    const inicio = inicioOperacao(contrato, ajuste);
    if (!inicio) return [];
    const porMes = new Map((contrato.linhas || []).filter(l => l.mes >= inicio).map(l => [l.mes, l]));
    let fim = fimOperacao(contrato, ajuste, hoje);
    for (const m of Object.keys(contrato.protocolo || {})) if (m >= inicio && m > fim && ORDEM[protocolo(contrato, m)] >= 1) fim = m;
    for (let n = mesNum(inicio); n <= mesNum(fim); n++) if (!porMes.has(numMes(n))) porMes.set(numMes(n), { mes: numMes(n), medido: null, faturado: null, recebido: null, vazio: true });
    return [...porMes.values()].sort((a, b) => b.mes.localeCompare(a.mes));
  }

  // Alertas abertos de um contrato. prazos: { medicao, faturamento, recebimento } em dias,
  // desde: primeiro mês (AAAA-MM) considerado nos alertas. A situação considerada é a oficial
  // (protocolo). Quando as planilhas divergem, o alerta é a divergência, não o atraso.
  function alertas(contrato, ajuste, prazos, hoje) {
    const h = dia(hoje), out = [];
    const ignorar = (ajuste && ajuste.meses) || {};
    const fim = fimOperacao(contrato, ajuste, hoje);
    for (const l of meses(contrato, ajuste, hoje)) {
      if (ignorar[l.mes] && ignorar[l.mes].semAlerta) continue;
      if (prazos.desde && l.mes < prazos.desde) continue;
      if (protocolo(contrato, l.mes) === "fora") continue;
      const s = oficial(contrato, l), conf = conferencia(contrato, l), fimMes = fimDoMes(l.mes);
      let tipo = null, venceu = null;
      if (conf === "aguardando-protocolo" || conf === "falta-financeiro") {
        // Conta a partir do que o financeiro registrou (recebimento, NF ou fim do mês), com 15 dias de folga.
        tipo = conf === "aguardando-protocolo" ? "protocolo" : "financeiro";
        const f = situacao(l);
        const base = conf === "aguardando-protocolo" && f === "recebido" && l.dataRecebimento ? dia(l.dataRecebimento)
          : conf === "aguardando-protocolo" && (f === "faturado" || f === "parcial") && l.emissao ? dia(l.emissao)
          : fimMes;
        venceu = base + 15 * 864e5;
      }
      else if (s === "sem-medicao" && l.mes <= fim) { tipo = "medicao"; venceu = fimMes + Math.max(0, (prazos.medicao || 0) - 1) * 864e5; }  // alerta a partir do dia "medicao" do mês seguinte
      else if (s === "medido") { tipo = "faturamento"; venceu = fimMes + prazos.faturamento * 864e5; }
      else if ((s === "faturado" || s === "parcial") && l.recebimentoPendente !== false) {
        tipo = "recebimento";
        venceu = (l.emissao ? dia(l.emissao) : fimMes + prazos.faturamento * 864e5) + prazos.recebimento * 864e5;
      }
      if (!tipo || h <= venceu) continue;
      const atraso = dias(venceu, h);
      out.push({ contrato: contrato.id, mes: l.mes, tipo, atraso, nivel: nivel(atraso), emissao: l.emissao || null, nf: l.nf || null,
        oficial: s, financeiro: situacao(l),
        valor: tipo === "recebimento" ? (l.faturado || 0) - (l.recebido || 0) : tipo === "faturamento" ? (l.medido || 0) : 0 });
    }
    return out;
  }

  // Até 30 dias além do prazo: atrasado; até 90: crítico; acima: muito crítico.
  const nivel = atraso => atraso > 90 ? "muito-critico" : atraso > 30 ? "critico" : "atrasado";
  const PESO = { "muito-critico": 3, critico: 2, atrasado: 1 };

  // Um alerta por contrato e tipo: junta os meses em aberto, conta o atraso pelo mais antigo.
  function agrupar(lista) {
    const grupos = new Map();
    for (const a of lista) {
      const k = a.contrato + "|" + a.tipo;
      if (!grupos.has(k)) grupos.set(k, { contrato: a.contrato, tipo: a.tipo, meses: [] });
      grupos.get(k).meses.push(a);
    }
    return [...grupos.values()].map(g => {
      g.meses.sort((x, y) => x.mes.localeCompare(y.mes));
      g.desde = g.meses[0].mes; g.ate = g.meses[g.meses.length - 1].mes;
      g.atraso = Math.max(...g.meses.map(m => m.atraso));
      g.nivel = nivel(g.atraso); g.peso = PESO[g.nivel];
      g.valor = g.meses.reduce((t, m) => t + m.valor, 0);
      return g;
    }).sort((x, y) => y.atraso - x.atraso);
  }

  return { situacao, protocolo, oficial, conferencia, inicioOperacao, fimOperacao, meses, alertas, agrupar, hojeBrasilia, somaMes, tem };
})();
if (typeof module !== "undefined") module.exports = Regras;

</script>
<script>
(() => {
const LINK_PAINEL = "https://denilsoncorporativo44-maker.github.io/medicoes-gct/"; // endereço do painel, usado nos links "abrir em nova aba"
const PRAZOS_PADRAO = { medicao: 10, faturamento: 45, recebimento: 30, desde: "2025-09" };
const TIPO = { medicao: "Medição atrasada", faturamento: "Faturamento atrasado", recebimento: "Recebimento atrasado", protocolo: "Aguardando protocolo", financeiro: "Falta lançar no financeiro" };
const CONF = { confere: "✓ Confere", "aguardando-protocolo": "Aguardando protocolo", "falta-financeiro": "Falta lançar no financeiro" };
const tagConf = k => k ? `<span class="conf conf-${k}">${CONF[k]}</span>` : "";
const SIT = { recebido: "Recebido", parcial: "Recebido em parte", faturado: "Faturado", medido: "Medido", "sem-medicao": "Pendente" };
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

const st = { contratos: [], ajustes: {}, prazos: { ...PRAZOS_PADRAO }, sinc: null, carregado: false, semBanco: false, editor: false, periodo: "12m", editando: null };
let db = null;
const hoje = () => Regras.hojeBrasilia();

// ---------- formatação ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = v => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const brlCurto = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return "R$ " + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " mi";
  if (a >= 1e3) return "R$ " + (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
  return brl(v);
};
const mesTxt = m => `${MESES[+m.slice(5, 7) - 1]}/${m.slice(2, 4)}`;
const mesLongo = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1, 15)).toLocaleDateString("pt-BR", { month: "long", year: "numeric", timeZone: "UTC" });
const dataTxt = d => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : "—";
const pct = v => v === null || v === undefined ? "—" : (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";

// ---------- dados derivados ----------
const ajusteDe = id => st.ajustes[id] || {};
const nomeDe = c => ajusteDe(c.id).nome || c.nome;
const grupoDe = c => ajusteDe(c.id).grupo || c.grupo;
const parte = c => ((c.info && c.info.participacaoGct) || 100) / 100;
const mesesDe = c => Regras.meses(c, ajusteDe(c.id), hoje());
// Um alerta por contrato e tipo (os meses em aberto ficam dentro dele).
const alertasDe = c => Regras.agrupar(Regras.alertas(c, ajusteDe(c.id), st.prazos, hoje()));
const todosAlertas = () => st.contratos.flatMap(alertasDe).sort((a, b) => b.atraso - a.atraso);
const contratoPorId = id => st.contratos.find(c => c.id === id);

function noPeriodo(m) {
  const h = hoje().slice(0, 7);
  if (st.periodo === "12m") return m > Regras.somaMes(h, -13) && m <= h;
  if (st.periodo === "tudo") return true;
  return m.startsWith(st.periodo);
}
function totais(lista) {
  const t = { medido: 0, faturado: 0, recebido: 0, medidoNaoRecebido: 0 };
  for (const { c, l } of lista) {
    const med = (l.medido || 0) * parte(c);
    t.medido += med; t.faturado += l.faturado || 0; t.recebido += l.recebido || 0;
    const s = Regras.situacao(l);
    if (s !== "recebido") t.medidoNaoRecebido += med;
  }
  return t;
}
const linhasPeriodo = cs => cs.flatMap(c => mesesDe(c).filter(l => noPeriodo(l.mes)).map(l => ({ c, l })));

// ---------- pequenos componentes ----------
function badge(alertas) {
  if (!alertas.length) return "";
  const nivel = alertas.some(a => a.nivel !== "atrasado") ? "critico" : "atrasado";
  return `<span class="badge ${nivel}" title="${alertas.length} alerta(s)">${alertas.length}</span>`;
}
// Cada contrato abre numa nova aba, com o próprio endereço (painel#id-do-contrato).
const abreContrato = id => LINK_PAINEL ? `href="${esc(LINK_PAINEL)}#${esc(id)}" target="_blank" rel="noopener"` : `href="#${esc(id)}" data-ir="${esc(id)}"`;
function linkContrato(c, texto) { return `<a ${abreContrato(c.id)}>${esc(texto || nomeDe(c))}</a>`; }
function novaAba(id) { return LINK_PAINEL ? `<a class="btn" href="${esc(LINK_PAINEL)}#${esc(id)}" target="_blank" rel="noopener">Abrir em nova aba ↗</a>` : ""; }

const NIVEL = { "muito-critico": "muito crítico", critico: "crítico", atrasado: "em atraso" };
const qtdMeses = n => `${n} ${n === 1 ? "mês" : "meses"}`;
function resumoAlerta(g, c) {
  const n = g.meses.length, periodo = n === 1 ? mesLongo(g.desde) : `de ${mesTxt(g.desde)} a ${mesTxt(g.ate)}`;
  if (g.tipo === "protocolo") return `${qtdMeses(n)} com o financeiro à frente do protocolo · ${periodo}`;
  if (g.tipo === "financeiro") return `${qtdMeses(n)} protocolado${n === 1 ? "" : "s"} e não lançado${n === 1 ? "" : "s"} no financeiro · ${periodo}`;
  if (g.tipo === "medicao") return `${qtdMeses(n)} sem medição protocolada · ${periodo}`;
  if (g.tipo === "faturamento") return `${qtdMeses(n)} medido${n === 1 ? "" : "s"} sem nota fiscal · ${periodo} · ${brl(g.valor * parte(c))} a faturar`;
  const nf = g.meses[0];
  return `${qtdMeses(n)} faturado${n === 1 ? "" : "s"} sem recebimento · ${periodo} · ${brl(g.valor)} a receber${nf.emissao ? ` · NF mais antiga emitida em ${dataTxt(nf.emissao)}` : ""}`;
}
function detalheMes(a) {
  if (a.tipo === "protocolo" || a.tipo === "financeiro") return `${mesTxt(a.mes)}: protocolo ${SIT[a.oficial].toLowerCase()}, financeiro ${SIT[a.financeiro].toLowerCase()} · ${a.atraso} dias`;
  if (a.tipo === "medicao") return `${mesTxt(a.mes)}: medição não lançada · ${a.atraso} dias`;
  if (a.tipo === "faturamento") return `${mesTxt(a.mes)}: sem nota fiscal · ${a.atraso} dias`;
  return `${mesTxt(a.mes)}: NF ${a.nf ? esc(a.nf) : "—"}${a.emissao ? `, emitida em ${dataTxt(a.emissao)}` : ""} · ${brl(a.valor)} · ${a.atraso} dias`;
}
// Todos os alertas num quadro só, separados por tipo; cada contrato numa linha curta.
const ORDEM_TIPO = ["recebimento", "faturamento", "medicao", "protocolo", "financeiro"];
function quadroAlertas(alertas) {
  const contratos = new Set(alertas.map(a => a.contrato)).size;
  const vazios = ORDEM_TIPO.filter(t => !alertas.some(a => a.tipo === t));
  const cols = ORDEM_TIPO.filter(t => !vazios.includes(t)).map(t => {
    const lista = alertas.filter(a => a.tipo === t);
    const itens = lista.map(g => {
      const c = contratoPorId(g.contrato);
      const sub = g.meses.length > 1 ? `${g.meses.length} meses · desde ${mesTxt(g.desde)}` : mesLongo(g.desde);
      return `<li><a ${abreContrato(c.id)} title="${esc(resumoAlerta(g, c).replace(/<[^>]+>/g, ""))}"><span class="q-dot ${g.nivel}"></span><span>${esc(nomeDe(c))}<small>${sub}</small></span><span class="q-dias ${g.nivel}">${g.atraso} ${g.atraso === 1 ? "dia" : "dias"}</span></a></li>`;
    }).join("");
    return `<div class="q-col${lista.length ? "" : " vazio"}"><h3 class="tipo-${t}">${TIPO[t]}<span>${lista.length}</span></h3>${lista.length ? `<ul>${itens}</ul>` : `<span class="q-nada">Nada em aberto</span>`}</div>`;
  }).join("");
  return `<section class="quadro" aria-label="Alertas">
    <div class="quadro-topo"><h2>${alertas.length ? `Atenção: ${alertas.length} ${alertas.length === 1 ? "pendência" : "pendências"} em ${contratos} ${contratos === 1 ? "contrato" : "contratos"}` : "Nenhuma pendência"}</h2>
      <div class="q-leg"><span><i class="q-dot atrasado"></i>até 30 dias</span><span><i class="q-dot critico"></i>31 a 90 dias</span><span><i class="q-dot muito-critico"></i>mais de 90 dias</span></div></div>
    ${cols ? `<div class="quadro-grade">${cols}</div>` : ""}
    ${vazios.length && alertas.length ? `<div class="q-nada">Sem pendências: ${vazios.map(t => TIPO[t].toLowerCase()).join(", ")}.</div>` : ""}
  </section>`;
}
function listaAlertas(alertas, mostrarContrato) {
  if (!alertas.length) return `<div class="empty">Nenhum alerta em aberto.</div>`;
  return `<div class="alerts">${alertas.map(g => {
    const c = contratoPorId(g.contrato);
    const det = g.meses.length > 1 || g.tipo === "protocolo" || g.tipo === "financeiro" ? `<details><summary>${g.meses.length > 1 ? `Ver os ${g.meses.length} meses` : "Ver detalhe"}</summary><ul>${g.meses.map(a => `<li>${detalheMes(a)}</li>`).join("")}</ul></details>` : "";
    return `<div class="alert ${g.nivel}"><span class="stripe"></span>
      <div class="alert-text">${mostrarContrato ? `<span>${linkContrato(c)} · <b class="tipo-${g.tipo}">${TIPO[g.tipo]}</b></span>` : `<b class="tipo-${g.tipo}">${TIPO[g.tipo]}</b>`}
        <span class="muted">${resumoAlerta(g, c)}</span>${det}</div>
      <div class="late num"><b>${g.atraso} ${g.atraso === 1 ? "dia" : "dias"}</b><div class="note">${NIVEL[g.nivel]}</div></div></div>`;
  }).join("")}</div>`;
}

// Para onde foi o dinheiro medido: cada mês é uma barra dividida em recebido,
// faturado aguardando pagamento e medido sem nota (valores da planilha financeira, parte GCT).
const ETAPAS = [["recebido", "Recebido", "var(--e-recebido)"], ["faturado", "Faturado, aguardando pagamento", "var(--e-faturado)"], ["medido", "Medido, sem nota fiscal", "var(--e-medido)"]];
function grafico(lista) {
  const porMes = new Map(), tot = { recebido: 0, faturado: 0, medido: 0 };
  for (const { c, l } of lista) {
    const v = (l.medido || 0) * parte(c);
    if (!v) continue;
    const sit = Regras.situacao(l), k = sit === "recebido" ? "recebido" : sit === "faturado" || sit === "parcial" ? "faturado" : "medido";
    const m = porMes.get(l.mes) || { recebido: 0, faturado: 0, medido: 0 };
    m[k] += v; tot[k] += v; porMes.set(l.mes, m);
  }
  const meses = [...porMes.keys()].sort().slice(-12).reverse();
  if (!meses.length) return `<div class="empty">Sem valores medidos no período.</div>`;
  const total = tot.recebido + tot.faturado + tot.medido;
  const pc = v => Math.round(v / total * 100) + "%";
  const max = Math.max(...meses.map(m => { const v = porMes.get(m); return v.recebido + v.faturado + v.medido; }));
  const linhas = meses.map(m => {
    const v = porMes.get(m), soma = v.recebido + v.faturado + v.medido;
    const partes = ETAPAS.filter(([k]) => v[k] > 0).map(([k, nome, cor]) =>
      `<i style="width:${v[k] / max * 100}%;background:${cor}" title="${mesTxt(m)} · ${nome}: ${brl(v[k])}"></i>`).join("");
    return `<span class="etapas-mes">${mesTxt(m)}</span><div class="etapas-barra" role="img" aria-label="${mesLongo(m)}: ${ETAPAS.map(([k, nome]) => `${nome} ${brl(v[k])}`).join(", ")}">${partes}</div><span class="etapas-total">${brlCurto(soma)}</span>`;
  }).join("");
  return `<div class="etapas">
    <p class="etapas-resumo">Do total medido no período (<b>${brl(total)}</b>), <b>${pc(tot.recebido)}</b> já foi recebido, <b>${pc(tot.faturado)}</b> está faturado aguardando pagamento e <b>${pc(tot.medido)}</b> ainda não tem nota fiscal.</p>
    <div class="etapas-legenda">${ETAPAS.map(([k, nome, cor]) => `<span><i style="background:${cor}"></i>${nome}: <b>${brlCurto(tot[k])}</b></span>`).join("")}</div>
    <div class="etapas-linhas">${linhas}</div>
    <p class="note" style="margin:0">Cada barra é o valor medido no mês (parte GCT), dividido pela etapa em que está hoje. Passe o mouse para ver os valores.</p>
  </div>`;
}

function seletorPeriodo() {
  const anos = [...new Set(st.contratos.flatMap(c => (c.linhas || []).map(l => l.mes.slice(0, 4))))].sort().reverse().slice(0, 4);
  const op = [["12m", "Últimos 12 meses"], ...anos.map(a => [a, a]), ["tudo", "Todo o histórico"]];
  return `<label class="field" for="periodo">Período<select id="periodo">${op.map(([v, t]) => `<option value="${v}"${st.periodo === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
}
function kpis(t) {
  return `<div class="kpis">
    <div class="kpi"><span class="eyebrow">Medido</span><b>${brlCurto(t.medido)}</b><small class="num">${brl(t.medido)}</small></div>
    <div class="kpi"><span class="eyebrow">Faturado</span><b>${brlCurto(t.faturado)}</b><small class="num">${brl(t.faturado)}</small></div>
    <div class="kpi"><span class="eyebrow">Recebido líquido</span><b>${brlCurto(t.recebido)}</b><small class="num">${brl(t.recebido)}</small></div>
    <div class="kpi"><span class="eyebrow">Medido não recebido</span><b>${brlCurto(t.medidoNaoRecebido)}</b><small class="num">${brl(t.medidoNaoRecebido)}</small></div>
  </div>`;
}

// ---------- telas ----------
function telaGeral() {
  const lista = linhasPeriodo(st.contratos);
  const alertas = todosAlertas();
  const linhasTabela = st.contratos.map(c => {
    const ls = mesesDe(c).filter(l => noPeriodo(l.mes)).map(l => ({ c, l }));
    const t = totais(ls);
    const ultimo = (c.linhas || []).filter(l => Regras.tem(l.medido)).map(l => l.mes).sort().pop();
    return `<tr><td>${linkContrato(c)}<div class="note">${esc(grupoDe(c))}</div></td>
      <td class="r num">${brl(t.medido)}</td><td class="r num">${brl(t.faturado)}</td><td class="r num">${brl(t.recebido)}</td>
      <td class="num">${ultimo ? mesTxt(ultimo) : "—"}</td><td>${resumoConf(c)}</td><td>${badge(alertasDe(c)) || '<span class="note">—</span>'}</td></tr>`;
  }).join("");
  return `
  <div class="head"><div class="head-text"><span class="eyebrow">Visão geral</span><h1>Todos os contratos</h1>
    <span class="muted">${st.contratos.length} contratos${st.sinc && st.sinc.atualizadoEm ? ` · dados de ${new Date(st.sinc.atualizadoEm).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" }).replace(",", " às")}` : ""}</span></div>
    <div class="tools">${seletorPeriodo()}</div></div>
  ${kpis(totais(lista))}
  ${quadroAlertas(alertas)}
  <p class="note" style="margin:-12px 0 0">Situação oficial = planilha de protocolo; valores = planilha financeira. Prazos: medição cobrada a partir do dia ${Math.max(1, st.prazos.medicao || 0)} do mês seguinte; nota fiscal até ${st.prazos.faturamento} dias após o fim do mês; recebimento até ${st.prazos.recebimento} dias após a emissão da NF. Cada contrato só é cobrado a partir do primeiro mês com medição. Um alerta por contrato e tipo: o atraso conta pelo mês mais antigo em aberto (até 30 dias, em atraso; até 90, crítico; acima, muito crítico). Alertas a partir de ${mesTxt(st.prazos.desde)}.</p>
  <section class="section"><h2>Para onde foi o valor medido</h2><div class="panel">${grafico(lista)}</div></section>
  <section class="section"><h2>Contratos</h2><div class="panel scroll"><table>
    <thead><tr><th>Contrato</th><th class="r">Medido</th><th class="r">Faturado</th><th class="r">Recebido líquido</th><th>Última medição</th><th>Conferência</th><th>Alertas</th></tr></thead>
    <tbody>${linhasTabela}</tbody></table></div>
    <p class="note">Nos contratos em consórcio, o valor medido entra nos totais pela parte da GCT (ex.: 50% nos lotes MinasTrans).</p></section>`;
}

// Divergências entre protocolo e financeiro desde o mês inicial dos alertas.
function divergencias(c) {
  return mesesDe(c).filter(l => l.mes >= (st.prazos.desde || "") && ["aguardando-protocolo", "falta-financeiro"].includes(Regras.conferencia(c, l)));
}
function resumoConf(c) {
  if (!c.protocolo || !Object.keys(c.protocolo).length) return '<span class="note">sem protocolo</span>';
  const d = divergencias(c);
  if (!d.length) return tagConf("confere");
  const k = d.some(l => Regras.conferencia(c, l) === "falta-financeiro") && !d.some(l => Regras.conferencia(c, l) === "aguardando-protocolo") ? "falta-financeiro" : "aguardando-protocolo";
  return `<span class="conf conf-${k}">${d.length} ${d.length === 1 ? "mês" : "meses"} a conferir</span>`;
}

function telaContrato(c) {
  const aj = ajusteDe(c.id), i = c.info || {};
  const meses = mesesDe(c), alertas = alertasDe(c);
  const lista = meses.filter(l => noPeriodo(l.mes)).map(l => ({ c, l }));
  const inicio = Regras.inicioOperacao(c, aj);
  const exec = i.percentualExecutado;
  const obs = aj.meses || {};
  const linhas = meses.map(l => {
    const s = Regras.oficial(c, l), o = obs[l.mes] || {};
    const editar = st.editor ? `<button class="btn link" data-editar="${l.mes}" aria-label="Editar observação de ${mesTxt(l.mes)}">Editar</button>` : "";
    let html = `<tr><td class="num"><b>${mesTxt(l.mes)}</b></td><td><span class="pill s-${s}">${SIT[s]}</span><br>${tagConf(Regras.conferencia(c, l))}</td>
      <td class="r num">${brl(l.medido)}</td><td class="r num">${brl(l.faturado)}</td>
      <td class="num">${l.nf ? esc(l.nf) : "—"}<div class="note">${l.emissao ? "emitida " + dataTxt(l.emissao) : ""}</div></td>
      <td class="r num">${brl(l.recebido)}</td><td class="num">${dataTxt(l.dataRecebimento)}</td>
      <td><div class="obs">${esc(o.texto || "")}${o.semAlerta ? `<div>Sem alerta neste mês</div>` : ""}</div>${editar}</td></tr>`;
    if (st.editando === l.mes) html += `<tr class="edit-row"><td colspan="8"><form class="edit-grid" data-form-mes="${l.mes}">
      <label class="field" for="obs-texto">Observação de ${mesTxt(l.mes)}<input type="text" id="obs-texto" maxlength="300" value="${esc(o.texto || "")}" placeholder="Ex.: bloqueio judicial do pagamento"></label>
      <label class="check"><input type="checkbox" id="obs-sem-alerta"${o.semAlerta ? " checked" : ""}> Não gerar alerta neste mês</label>
      <button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" data-cancelar>Cancelar</button></form></td></tr>`;
    return html;
  }).join("");
  const avulsos = (c.avulsos || []).filter(a => a.descricao);
  const cadastro = st.editor ? `<details class="panel"><summary>Ajustar cadastro do contrato</summary><form class="edit-grid" id="form-cadastro" style="padding:0 14px 14px">
      <label class="field" for="cad-nome">Nome exibido<input type="text" id="cad-nome" maxlength="120" value="${esc(nomeDe(c))}"></label>
      <label class="field" for="cad-inicio">Início da operação (primeiro mês cobrado)<input type="month" id="cad-inicio" value="${esc(aj.inicio || "")}"></label>
      <label class="field" for="cad-fim">Último mês com medição prevista<input type="month" id="cad-fim" value="${esc(aj.fim || "")}"></label>
      <button class="btn primary" type="submit">Salvar</button>
      <p class="note" style="flex-basis:100%;margin:0">Sem início informado, vale o primeiro mês com medição na planilha${inicio ? ` (hoje: ${mesTxt(inicio)})` : ""}. Sem último mês informado, vale o vencimento da planilha.</p></form></details>` : "";
  return `
  <div class="head"><div class="head-text"><span class="eyebrow">${esc(grupoDe(c))}${i.numero ? " · Contrato " + esc(i.numero) : ""}</span><h1>${esc(nomeDe(c))}</h1>
    <span class="muted">${inicio ? `Acompanhado desde ${mesLongo(inicio)}` : "Ainda sem medição na planilha"}${c.aba ? ` · aba “${esc(c.aba)}”` : ""}</span></div>
    <div class="tools">${seletorPeriodo()}<a class="btn" href="#geral" data-ir="geral">← Visão geral</a></div></div>
  ${c.aba ? "" : `<div class="notice">Este contrato não tem aba correspondente na planilha, por isso não é atualizado automaticamente. Indique qual aba usar para incluí-lo na próxima atualização.</div>`}
  <div class="facts">
    <div class="fact"><span class="eyebrow">Vencimento</span><b>${dataTxt(i.vencimento)}</b><span class="note">${i.prazo ? esc(i.prazo) : ""}${i.aditivo && !/%/.test(i.aditivo) ? " · " + esc(i.aditivo) + " aditivo" : ""}</span></div>
    <div class="fact"><span class="eyebrow">Valor do contrato</span><b>${brl(i.valorContrato)}</b><span class="note">Assinado em ${dataTxt(i.assinatura)}</span></div>
    <div class="fact"><span class="eyebrow">Saldo</span><b>${brl(i.saldo)}</b></div>
    <div class="fact"><span class="eyebrow">Executado</span><b>${pct(exec)}</b><div class="bar"><i class="${exec > 1 ? "over" : ""}" style="width:${Math.min(100, (exec || 0) * 100)}%"></i></div></div>
    <div class="fact"><span class="eyebrow">Parte GCT</span><b>${i.participacaoGct ? i.participacaoGct + "%" : "100%"}</b></div>
  </div>
  ${kpis(totais(lista))}
  <section class="section"><div class="section-head"><h2>Alertas</h2>${badge(alertas)}</div><div class="panel">${listaAlertas(alertas, false)}</div></section>
  <section class="section"><h2>Medições mês a mês</h2><div class="panel scroll"><table>
    <thead><tr><th>Mês</th><th>Situação (protocolo)</th><th class="r">Medido${parte(c) < 1 ? " (100%)" : ""}</th><th class="r">Faturado</th><th>NF</th><th class="r">Recebido líquido</th><th>Recebido em</th><th>Observação</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="8"><div class="empty">Nenhuma medição lançada.</div></td></tr>`}</tbody></table></div></section>
  <section class="section"><h2>Para onde foi o valor medido</h2><div class="panel">${grafico(lista)}</div></section>
  ${avulsos.length ? `<details class="panel"><summary>Lançamentos avulsos de reajuste (${avulsos.length})</summary><div class="scroll"><table><thead><tr><th>Descrição</th><th class="r">Valor</th><th>NF</th><th>Emissão</th><th class="r">Líquido</th><th>Recebido em</th></tr></thead><tbody>
    ${avulsos.map(a => `<tr><td>${esc(a.descricao)}</td><td class="r num">${brl(a.faturado ?? a.medido)}</td><td>${esc(a.nf || "—")}</td><td class="num">${dataTxt(a.emissao)}</td><td class="r num">${brl(a.liquido)}</td><td class="num">${dataTxt(a.dataRecebimento)}</td></tr>`).join("")}
    </tbody></table></div><p class="note" style="padding:0 14px">Estes lançamentos não têm mês de referência e ficam fora dos totais mensais.</p></details>` : ""}
  ${cadastro}`;
}

function telaAjustes() {
  if (!st.editor) return `<div class="empty">Somente editores alteram os prazos dos alertas.</div>`;
  const p = st.prazos;
  return `<div class="head"><div class="head-text"><span class="eyebrow">Configuração</span><h1>Prazos dos alertas</h1></div><div class="tools"><a class="btn" href="#geral" data-ir="geral">← Visão geral</a></div></div>
  <form class="panel edit-grid" id="form-prazos" style="padding:16px">
    <label class="field" for="p-medicao">Medição: cobrar a partir do dia (do mês seguinte)<input type="number" id="p-medicao" min="1" max="28" value="${p.medicao}"></label>
    <label class="field" for="p-faturamento">Nota fiscal: dias após o fim do mês<input type="number" id="p-faturamento" min="0" max="365" value="${p.faturamento}"></label>
    <label class="field" for="p-recebimento">Recebimento: dias após a emissão da NF<input type="number" id="p-recebimento" min="0" max="365" value="${p.recebimento}"></label>
    <label class="field" for="p-desde">Considerar alertas a partir de<input type="month" id="p-desde" value="${esc(p.desde || "")}"></label>
    <button class="btn primary" type="submit">Salvar prazos</button>
  </form>
  <p class="note">Cada contrato mostra um alerta por tipo, contando o atraso pelo mês mais antigo em aberto. Até 30 dias além do prazo: em atraso; de 31 a 90: crítico; acima de 90: muito crítico.</p>`;
}

// ---------- navegação e renderização ----------
function rota() { const h = decodeURIComponent(location.hash.slice(1)); return h || "geral"; }
function ir(id) { if (location.hash.slice(1) !== id) location.hash = id; else render(); }

function renderNav() {
  const r = rota();
  const grupos = new Map();
  for (const c of st.contratos) { const g = grupoDe(c); if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(c); }
  const total = todosAlertas();
  let html = `<a href="#geral" data-ir="geral"${r === "geral" ? ' aria-current="page"' : ""}><span>Visão geral</span>${badge(total)}</a>`;
  for (const [g, cs] of grupos) {
    html += `<div class="nav-group">${esc(g)}</div>`;
    html += cs.map(c => `<a ${abreContrato(c.id)}${r === c.id ? ' aria-current="page"' : ""}><span>${esc(nomeDe(c))}</span>${badge(alertasDe(c))}</a>`).join("");
  }
  if (st.editor) html += `<div class="nav-group">Configuração</div><a href="#prazos" data-ir="prazos"${r === "prazos" ? ' aria-current="page"' : ""}><span>Prazos dos alertas</span></a>`;
  document.getElementById("nav").innerHTML = html;
  const sel = document.getElementById("mobile-select");
  sel.innerHTML = `<option value="geral">Visão geral</option>` + [...grupos].map(([g, cs]) => `<optgroup label="${esc(g)}">${cs.map(c => `<option value="${esc(c.id)}">${esc(nomeDe(c))}${alertasDe(c).length ? ` (${alertasDe(c).length} alertas)` : ""}</option>`).join("")}</optgroup>`).join("") + (st.editor ? `<option value="prazos">Prazos dos alertas</option>` : "");
  sel.value = r;
  const s = st.sinc;
  document.getElementById("side-foot").innerHTML = (s && s.atualizadoEm ? `Planilha lida em ${new Date(s.atualizadoEm).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" })}.<br>Atualização automática toda segunda-feira.` : "") + (s && s.falha ? `<br><b>Última tentativa falhou:</b> ${esc(s.falha)}` : "");
}

function avisosSinc() {
  const a = (st.sinc && st.sinc.avisos) || [];
  if (!a.length || rota() !== "geral") return "";
  return `<details class="notice"><summary>Pontos para conferir na planilha (${a.length})</summary><ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>`;
}

function render() {
  const v = document.getElementById("view");
  if (!st.carregado) { v.innerHTML = `<div class="empty">Carregando contratos…</div>`; return; }
  if (!st.contratos.length) {
    v.innerHTML = `<div class="empty">${st.semBanco ? "Não foi possível abrir os dados do painel. Entre com sua conta Claude para ver os contratos." : "Os contratos aparecem aqui assim que a planilha de faturamento for lida pela primeira vez."}</div>`;
    return;
  }
  renderNav();
  const r = rota(), c = contratoPorId(r);
  v.innerHTML = r === "prazos" ? telaAjustes() : c ? telaContrato(c) : avisosSinc() + faixaMes() + telaGeral();
  if (!render.avisou && st.carregado) { render.avisou = true; setTimeout(() => mostrarAviso(false), 600); }
  document.title = c ? `${nomeDe(c)} · Medições GCT` : "Medições GCT";
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
}

async function salvarAjuste(id, mudanca) {
  if (!db) return;
  const atual = JSON.parse(JSON.stringify(ajusteDe(id)));
  const novo = { ...atual, ...mudanca };
  try { await db.doc("ajustes/" + id).set(novo); toast("Alteração salva"); }
  catch (e) { toast(e && e.code === "invalid_argument" ? "Você não tem permissão para editar este painel." : "Não foi possível salvar. Tente de novo em instantes."); }
}

// ---------- virada de mês ----------
// Mês anterior sem medição protocolada: aviso ao abrir o painel e na virada do mês com o painel aberto.
function pendentesMesAnterior() {
  const h = hoje(), ant = Regras.somaMes(h.slice(0, 7), -1);
  // Só cobra a partir do dia configurado (padrão: dia 10) do mês seguinte.
  if (Number(h.slice(8, 10)) < Math.max(1, st.prazos.medicao || 0)) return [];
  return st.contratos.map(c => {
    const aj = ajusteDe(c.id);
    if ((aj.meses || {})[ant]?.semAlerta) return null;
    const ini = Regras.inicioOperacao(c, aj);
    if (!ini || ini > ant || Regras.fimOperacao(c, aj, h) < ant) return null;
    if (Regras.protocolo(c, ant) === "fora") return null;
    const l = (c.linhas || []).find(x => x.mes === ant) || { mes: ant, medido: null, faturado: null, recebido: null };
    if (Regras.oficial(c, l) !== "sem-medicao") return null;
    return { c, noFinanceiro: Regras.tem(l.medido) };
  }).filter(Boolean);
}
function faixaMes() {
  const p = pendentesMesAnterior();
  if (!p.length) return "";
  const ant = Regras.somaMes(hoje().slice(0, 7), -1);
  return `<div class="faixa-mes"><span><b>${mesLongo(ant)}</b> ainda sem medição protocolada em <b>${p.length} ${p.length === 1 ? "contrato" : "contratos"}</b>.</span><button class="btn" type="button" data-abrir-aviso>Ver quais</button></div>`;
}
const chaveAviso = () => "aviso-medicao-" + hoje();
function mostrarAviso(forcar) {
  const p = pendentesMesAnterior(), el = document.getElementById("aviso");
  if (!p.length) { el.hidden = true; return; }
  let visto = false;
  try { visto = localStorage.getItem(chaveAviso()) === "1"; } catch {}
  if (visto && !forcar) return;
  const ant = Regras.somaMes(hoje().slice(0, 7), -1);
  el.innerHTML = `<div class="aviso" role="alertdialog" aria-modal="true" aria-labelledby="aviso-titulo">
    <span class="eyebrow">Virada de mês</span>
    <h2 id="aviso-titulo">${mesLongo(ant).replace(/^./, x => x.toUpperCase())} ainda não foi medido</h2>
    <p>${p.length} ${p.length === 1 ? "contrato está" : "contratos estão"} sem medição protocolada do mês anterior:</p>
    <ul>${p.map(x => `<li><a ${abreContrato(x.c.id)}>${esc(nomeDe(x.c))}</a><small>${x.noFinanceiro ? "lançado no financeiro, falta protocolar" : "sem medição"}</small></li>`).join("")}</ul>
    <div class="aviso-acoes"><button class="btn primary" type="button" data-fechar-aviso>Entendi</button></div>
  </div>`;
  el.hidden = false;
  el.querySelector("[data-fechar-aviso].btn").focus();
}
function fecharAviso() {
  document.getElementById("aviso").hidden = true;
  try { localStorage.setItem(chaveAviso(), "1"); } catch {}
}
// Confere a virada do mês a cada 5 minutos com o painel aberto.
let mesAtual = hoje().slice(0, 7);
setInterval(() => {
  const m = hoje().slice(0, 7);
  if (m !== mesAtual) { mesAtual = m; render(); mostrarAviso(true); }
}, 5 * 60 * 1000);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("aviso").hidden) fecharAviso(); });

// ---------- eventos ----------
document.addEventListener("click", e => {
  if (e.target.closest("[data-abrir-aviso]")) { mostrarAviso(true); return; }
  if (e.target.closest("[data-fechar-aviso]")) fecharAviso();
  else if (e.target.id === "aviso") { fecharAviso(); return; }
  const alvo = e.target.closest("[data-ir]");
  if (alvo && !e.target.closest("a[target]")) { e.preventDefault(); st.editando = null; ir(alvo.dataset.ir); window.scrollTo(0, 0); return; }
  const ed = e.target.closest("[data-editar]");
  if (ed) { st.editando = ed.dataset.editar; render(); const i = document.getElementById("obs-texto"); if (i) i.focus(); return; }
  if (e.target.closest("[data-cancelar]")) { st.editando = null; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "periodo") { st.periodo = e.target.value; render(); }
  if (e.target.id === "mobile-select") { st.editando = null; ir(e.target.value); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = rota();
  if (e.target.dataset.formMes) {
    const mes = e.target.dataset.formMes;
    const meses = { ...(ajusteDe(id).meses || {}) };
    const texto = document.getElementById("obs-texto").value.trim(), semAlerta = document.getElementById("obs-sem-alerta").checked;
    if (texto || semAlerta) meses[mes] = { texto, semAlerta }; else delete meses[mes];
    st.editando = null;
    await salvarAjuste(id, { meses });
  } else if (e.target.id === "form-cadastro") {
    const c = contratoPorId(id);
    const nome = document.getElementById("cad-nome").value.trim();
    await salvarAjuste(id, { nome: nome && nome !== c.nome ? nome : "", inicio: document.getElementById("cad-inicio").value, fim: document.getElementById("cad-fim").value });
  } else if (e.target.id === "form-prazos") {
    const n = k => Math.max(0, Math.min(365, parseInt(document.getElementById("p-" + k).value, 10) || 0));
    const prazos = { medicao: n("medicao"), faturamento: n("faturamento"), recebimento: n("recebimento"), desde: document.getElementById("p-desde").value || PRAZOS_PADRAO.desde };
    try { await db.doc("config/alertas").set(prazos); toast("Prazos salvos"); }
    catch { toast("Não foi possível salvar os prazos."); }
  }
});

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(senha)), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CRIPT.sal), iterations: CRIPT.iteracoes, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const txt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CRIPT.iv) }, chave, b64(CRIPT.dados));
  return JSON.parse(new TextDecoder().decode(txt));
}
function aplicar(d) {
  st.contratos = d.contratos.sort((a, b) => (a.ordem ?? 99) - (b.ordem ?? 99));
  st.ajustes = d.ajustes || {};
  st.prazos = { ...PRAZOS_PADRAO, ...(d.alertas || {}) };
  st.sinc = d.sinc || null;
  st.carregado = true;
  document.getElementById("login").hidden = true;
  render();
}
async function iniciar() {
  const form = document.getElementById("login-form"), campo = document.getElementById("login-senha"), msg = document.getElementById("login-msg");
  let salva = null;
  try { salva = localStorage.getItem("medicoes-gct-senha"); } catch {}
  if (salva) { try { aplicar(await abrir(salva)); return; } catch { try { localStorage.removeItem("medicoes-gct-senha"); } catch {} } }
  document.getElementById("login").hidden = false;
  campo.focus();
  form.addEventListener("submit", async e => {
    e.preventDefault(); e.stopPropagation();
    msg.textContent = "Abrindo…";
    try {
      const d = await abrir(campo.value);
      if (document.getElementById("login-lembrar").checked) { try { localStorage.setItem("medicoes-gct-senha", campo.value); } catch {} }
      aplicar(d);
    } catch { msg.textContent = "Senha incorreta. Tente de novo."; campo.select(); }
  }, true);
}
iniciar();
})();
